{% extends "base.html" %}{% block content %}
<div class="page-heading"><div class="eyebrow">STEP 02 · QUIZ BUILDER</div><h1>Create your practice quiz</h1><p>Choose the material and challenge level. Chapter and topic can be left as All.</p></div>
<div class="card form-card"><form method="post"><div class="form-grid"><div class="field full-row"><label>Study Material <strong>*</strong></label><select name="material_id" required>{% for m in materials %}<option value="{{m.id}}">{{m.filename}}</option>{% endfor %}</select></div><div class="field"><label>Number of Questions <strong>*</strong></label><input type="number" name="count" min="1" max="100" placeholder="e.g. 10" required></div><div class="field"><label>Difficulty <strong>*</strong></label><select name="difficulty" required><option value="">Select difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="field"><label>Chapter <span>Optional</span></label><input name="chapter" placeholder="All Chapters"></div><div class="field"><label>Topic <span>Optional</span></label><input name="topic" placeholder="All Topics"></div></div><div class="hint">✦ Leave Chapter and Topic blank to generate from the entire selected manual.</div><button class="primary">Generate My Quiz →</button></form></div>{% endblock %}
