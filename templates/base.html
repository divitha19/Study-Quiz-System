<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Quiz</title><link rel="stylesheet" href="/static/style.css"></head><body>
<nav><a class="brand" href="{{url_for('dashboard') if session.get('user_id') else url_for('login')}}"><span>✦</span> Study Quiz</a>{% if session.get("user_id") %}<div class="navlinks"><span class="hello">Hi, {{session.get("username")}}</span><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('generate')}}">Generate</a><a href="{{url_for('logout')}}" class="logout">Logout</a></div>{% endif %}</nav>
<main>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<div>{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
